services:
  ray-head:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: python-ray:dev
    command: >
      ray start --head
      --port=6379
      --num-cpus=2
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --ray-client-server-port=10001
      --block
    ports:
      - "8265:8265"   # dashboard / job submission
      - "10001:10001" # Ray Client
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "ray", "health-check", "--address", "127.0.0.1:6379"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  ray-worker:
    image: python-ray:dev
    command: ray start --address=ray-head:6379 --num-cpus=2 --block
    shm_size: "2gb"
    depends_on:
      ray-head:
        condition: service_healthy
